# API SEN-AIR : base PostgreSQL, API REST et consommateur du flux Kafka du pipeline de l'équipe data.
#   cp .env.example .env && docker compose up -d --build
# Kafka local (si le pipeline de l'équipe data ne tourne pas) :  docker compose --profile kafka up -d
name: senair

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: senair
      POSTGRES_USER: senair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senair -d senair"]
      interval: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: senair.api/Dockerfile }
    image: senair-api:local
    env_file: .env
    environment:
      DATABASE_URL: postgres://senair:${POSTGRES_PASSWORD}@db:5432/senair
    command: ["api"]
    ports:
      - "8000:8000"
    volumes:
      - media:/data/media
    depends_on:
      db: { condition: service_healthy }

  stream:
    image: senair-api:local
    env_file: .env
    environment:
      DATABASE_URL: postgres://senair:${POSTGRES_PASSWORD}@db:5432/senair
    command: ["stream"]
    restart: unless-stopped
    volumes:
      - media:/data/media
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }

  # Kafka local mono-nœud (KRaft), uniquement pour développer sans le pipeline de l'équipe data.
  kafka:
    profiles: ["kafka"]
    image: bitnamilegacy/kafka:3.7.0
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

volumes:
  pgdata:
  media:
