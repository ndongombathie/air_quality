      responses:
        '200':
          description: URL signée temporaire
          content:
            application/json:
              schema: { type: object, required: [downloadUrl, fileName, expiresAt], properties: { downloadUrl: { type: string, format: uri }, fileName: { type: string }, expiresAt: { type: string, format: date-time } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    StationId: { name: stationId, in: path, required: true, schema: { type: string } }
    AlertId: { name: alertId, in: path, required: true, schema: { type: string } }
    From: { name: from, in: query, required: true, schema: { type: string, format: date-time } }
    To: { name: to, in: query, required: true, schema: { type: string, format: date-time } }
    FromOptional: { name: from, in: query, schema: { type: string, format: date-time } }
    ToOptional: { name: to, in: query, schema: { type: string, format: date-time } }
    Granularity: { name: granularity, in: query, schema: { $ref: '#/components/schemas/Granularity' } }
    Pollutants: { name: pollutants, in: query, description: 'ex. pm25,pm10', schema: { type: string } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }

  responses:
    NotFound: { description: Introuvable, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Unauthorized: { description: Non authentifié, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Forbidden: { description: Permission insuffisante, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Validation: { description: Données invalides (details.fields), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    RateLimited: { description: Trop de requêtes, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  schemas:
    DateTime: { type: string, format: date-time }
    NullableNumber: { type: [number, 'null'] }

    AqiLevel: { type: string, enum: [good, moderate, unhealthy_sensitive, unhealthy, very_unhealthy, hazardous] }
    PollutantCode: { type: string, enum: [pm25, pm10, no2, so2, co, o3] }
    MeasureCode: { type: string, enum: [pm25, pm10, no2, so2, co, o3, co2, tvoc, nh3, no] }
    Unit: { type: string, enum: ['µg/m³', 'mg/m³', ppm, ppb, index] }
    ForecastHorizon: { type: string, enum: [1h, 2h, 3h, 1d, 2d, 3d] }
    ReferenceStandard: { type: string, enum: [WHO_2021, NS_05_062] }
    AveragingPeriod: { type: string, enum: [1h, 8h, 24h, 1y] }
    DataStatus: { type: string, enum: [measured, estimated, forecast] }
    Freshness: { type: string, enum: [fresh, stale, outdated, unknown] }
    Granularity: { type: string, enum: [raw, hour, day] }
    StationType: { type: string, enum: [industrial, residential, road, reference] }
    StationStatus: { type: string, enum: [online, offline, maintenance] }
    AlertStatus: { type: string, enum: [active, acknowledged, resolved] }
    ArticleCategory: { type: string, enum: [alert, info, report, regulation, event, education] }
    ArticleStatus: { type: string, enum: [draft, published, archived] }
    HealthProfileId: { type: string, enum: [general, children, elderly, asthma, cardiac, pregnant, outdoor_worker, athlete] }
    Role: { type: string, enum: [citizen, authority, admin] }
    Permission:
      type: string
      enum: ['profile:manage', 'notifications:manage', 'admin:access', 'alerts:manage', 'articles:manage', 'reports:read', 'reports:generate', 'analytics:read', 'stations:manage', 'thresholds:manage', 'sources:manage', 'models:manage', 'users:manage', 'audit:read', 'data:export_raw']

    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: slug_taken }
        message: { type: string }
        details: { type: object, additionalProperties: true, properties: { fields: { type: object, additionalProperties: { type: string } } } }
        requestId: { type: string }

    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties: { latitude: { type: number }, longitude: { type: number } }

    ApiMetadata:
      type: object
      required: [apiVersion, dataUpdatedAt, models, references]
      properties:
        apiVersion: { type: string }
        dataUpdatedAt: { type: [string, 'null'], format: date-time }
        models: { type: array, items: { type: object, properties: { name: { type: string }, task: { type: string }, version: { type: string } } } }
        references: { type: array, items: { $ref: '#/components/schemas/ReferenceStandard' } }

    Zone:
      type: object
      required: [id, name, centroid]
      properties:
        id: { type: string }
        name: { type: string }
        centroid: { $ref: '#/components/schemas/GeoPoint' }
        geometry: { description: GeoJSON Polygon/MultiPolygon }

    Station:
      type: object
      required: [id, externalId, name, shortName, zoneId, zoneName, location, type, status, provider, lastObservedAt]
      properties:
        id: { type: string }
        externalId: { type: [string, 'null'], description: 'ex. location_id AirGradient' }
        name: { type: string }
        shortName: { type: string }
        zoneId: { type: string }
        zoneName: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        type: { $ref: '#/components/schemas/StationType' }
        status: { $ref: '#/components/schemas/StationStatus' }
        provider: { type: string }
        lastObservedAt: { type: [string, 'null'], format: date-time }
        latest: { oneOf: [{ $ref: '#/components/schemas/AirQualitySnapshot' }, { type: 'null' }] }

    StationPatch:
      type: object
      description: Mise à jour partielle de StationInput (tous les champs sont facultatifs).
      properties: {"name": {"type": "string", "maxLength": 120}, "shortName": {"type": "string", "maxLength": 40}, "zoneId": {"type": "string"}, "location": {"$ref": "#/components/schemas/GeoPoint"}, "type": {"$ref": "#/components/schemas/StationType"}, "status": {"$ref": "#/components/schemas/StationStatus"}, "externalId": {"type": ["string", "null"]}, "provider": {"type": "string"}}
    ThresholdPatch:
      type: object
      description: Mise à jour partielle de ThresholdInput (tous les champs sont facultatifs).
      properties: {"pollutant": {"$ref": "#/components/schemas/PollutantCode"}, "reference": {"$ref": "#/components/schemas/ReferenceStandard"}, "period": {"$ref": "#/components/schemas/AveragingPeriod"}, "value": {"type": "number", "exclusiveMinimum": 0}, "unit": {"$ref": "#/components/schemas/Unit"}, "zoneId": {"type": ["string", "null"], "description": "null = seuil global ville"}, "alertLevel": {"$ref": "#/components/schemas/AqiLevel"}, "enabled": {"type": "boolean"}}
    ArticlePatch:
      type: object
      description: Mise à jour partielle de ArticleInput (tous les champs sont facultatifs).
      properties: {"title": {"type": "string", "minLength": 5, "maxLength": 160}, "slug": {"type": "string", "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$", "maxLength": 80}, "excerpt": {"type": "string", "minLength": 10, "maxLength": 300}, "content": {"type": "string", "minLength": 20, "maxLength": 50000}, "category": {"$ref": "#/components/schemas/ArticleCategory"}, "status": {"$ref": "#/components/schemas/ArticleStatus"}, "featured": {"type": "boolean"}, "coverImageUrl": {"type": ["string", "null"], "format": "uri", "description": "HTTPS uniquement"}, "mediaIds": {"type": "array", "maxItems": 10, "items": {"type": "string"}, "description": "Médias envoyés via /admin/media, dans l'ordre d'affichage"}, "tags": {"type": "array", "maxItems": 10, "items": {"type": "string", "maxLength": 30}}}

    StationInput:
      type: object
      required: [name, shortName, zoneId, location, type, status, externalId, provider]
      properties:
        name: { type: string, maxLength: 120 }
        shortName: { type: string, maxLength: 40 }
        zoneId: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        type: { $ref: '#/components/schemas/StationType' }
        status: { $ref: '#/components/schemas/StationStatus' }
        externalId: { type: [string, 'null'] }
        provider: { type: string }

    Measure:
      type: object
      required: [code, value, unit, source, subIndex]
      properties:
        code: { $ref: '#/components/schemas/MeasureCode' }
        value: { $ref: '#/components/schemas/NullableNumber' }
        unit: { $ref: '#/components/schemas/Unit' }
        source: { type: string, enum: [sensor, openweathermap, satellite, model], description: Origine de la variable (capteur de la station ou OpenWeatherMap à l'échelle de la ville) }
        subIndex: { type: [number, 'null'], description: concentration / valeur limite × 100 }

    Weather:
      type: object
      required: [temperatureC, humidityPct, windSpeedMs, windDirectionDeg, pressureHpa, precipitationMm, source, observedAt]
      properties:
        temperatureC: { $ref: '#/components/schemas/NullableNumber' }
        humidityPct: { $ref: '#/components/schemas/NullableNumber' }
        windSpeedMs: { $ref: '#/components/schemas/NullableNumber' }
        windDirectionDeg: { $ref: '#/components/schemas/NullableNumber' }
        pressureHpa: { $ref: '#/components/schemas/NullableNumber' }
        precipitationMm: { $ref: '#/components/schemas/NullableNumber' }
        source: { type: string, enum: [sensor, openweathermap] }
        observedAt: { type: [string, 'null'], format: date-time }

    AirQualitySnapshot:
      type: object
      required: [aqi, level, dominantPollutant, measures, weather, observedAt, status, freshness]
      properties:
        aqi: { $ref: '#/components/schemas/NullableNumber' }
        level: { oneOf: [{ $ref: '#/components/schemas/AqiLevel' }, { type: 'null' }] }
        dominantPollutant: { oneOf: [{ $ref: '#/components/schemas/PollutantCode' }, { type: 'null' }] }
        measures: { type: array, items: { $ref: '#/components/schemas/Measure' } }
        weather: { oneOf: [{ $ref: '#/components/schemas/Weather' }, { type: 'null' }] }
        observedAt: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/DataStatus' }
        freshness: { $ref: '#/components/schemas/Freshness' }

    LocationAirQuality:
      allOf:
        - { $ref: '#/components/schemas/AirQualitySnapshot' }
        - type: object
          required: [location, zoneId, zoneName, nearestStationId, distanceToNearestStationM, confidence]
          properties:
            location: { $ref: '#/components/schemas/GeoPoint' }
            zoneId: { type: [string, 'null'] }
            zoneName: { type: [string, 'null'] }
            nearestStationId: { type: [string, 'null'] }
            distanceToNearestStationM: { $ref: '#/components/schemas/NullableNumber' }
            confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }

    HistoryPoint:
      type: object
      required: [at, aqi, values]
      properties:
        at: { $ref: '#/components/schemas/DateTime' }
        aqi: { $ref: '#/components/schemas/NullableNumber' }
        values: { type: object, additionalProperties: { type: [number, 'null'] }, description: 'clés = MeasureCode' }

    History:
      type: object
      required: [scope, scopeId, granularity, from, to, points]
      properties:
        scope: { type: string, enum: [station, zone, city] }
        scopeId: { type: string }
        granularity: { $ref: '#/components/schemas/Granularity' }
        from: { $ref: '#/components/schemas/DateTime' }
        to: { $ref: '#/components/schemas/DateTime' }
        points: { type: array, items: { $ref: '#/components/schemas/HistoryPoint' } }

    ZoneRanking:
      type: object
      required: [zoneId, zoneName, aqi, level, dominantPollutant]
      properties:
        zoneId: { type: string }
        zoneName: { type: string }
        aqi: { $ref: '#/components/schemas/NullableNumber' }
        level: { oneOf: [{ $ref: '#/components/schemas/AqiLevel' }, { type: 'null' }] }
        dominantPollutant: { oneOf: [{ $ref: '#/components/schemas/PollutantCode' }, { type: 'null' }] }

    AirQualitySummary:
      type: object
      required: [scope, scopeId, name, aqi, level, dominantPollutant, measures, weather, observedAt, status, freshness, stationsReporting, stationsTotal, comparison, worstZones]
      properties:
        scope: { type: string, enum: [city, zone] }
        scopeId: { type: string }
        name: { type: string }
        aqi: { $ref: '#/components/schemas/NullableNumber' }
        level: { oneOf: [{ $ref: '#/components/schemas/AqiLevel' }, { type: 'null' }] }
        dominantPollutant: { oneOf: [{ $ref: '#/components/schemas/PollutantCode' }, { type: 'null' }] }
        measures: { type: array, items: { $ref: '#/components/schemas/Measure' } }
        weather: { oneOf: [{ $ref: '#/components/schemas/Weather' }, { type: 'null' }] }
        observedAt: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/DataStatus' }
        freshness: { $ref: '#/components/schemas/Freshness' }
        stationsReporting: { type: integer }
        stationsTotal: { type: integer }
        comparison:
          type: object
          required: [vsYesterday, vsLastWeek]
          properties: { vsYesterday: { $ref: '#/components/schemas/NullableNumber' }, vsLastWeek: { $ref: '#/components/schemas/NullableNumber' } }
        worstZones: { type: array, items: { $ref: '#/components/schemas/ZoneRanking' } }

    HeatmapCell:
      type: object
      required: [location, value, aqi, level, uncertainty]
      properties:
        location: { $ref: '#/components/schemas/GeoPoint' }
        value: { $ref: '#/components/schemas/NullableNumber' }
        aqi: { $ref: '#/components/schemas/NullableNumber' }
        level: { oneOf: [{ $ref: '#/components/schemas/AqiLevel' }, { type: 'null' }] }
        uncertainty: { type: [number, 'null'], minimum: 0, maximum: 1 }

    Heatmap:
      type: object
      required: [layer, at, resolutionM, method, modelVersion, generatedAt, status, cells]
      properties:
        layer: { type: string, description: "PollutantCode ou 'aqi'" }
        at: { $ref: '#/components/schemas/DateTime' }
        resolutionM: { type: integer }
        method: { type: string, enum: [kriging, idw, random_forest, cokriging] }
        modelVersion: { type: string }
        generatedAt: { $ref: '#/components/schemas/DateTime' }
        status: { $ref: '#/components/schemas/DataStatus' }
        cells: { type: array, items: { $ref: '#/components/schemas/HeatmapCell' } }

    Forecast:
      type: object
      required: [horizon, validAt, aqi, level, dominantPollutant, values, confidence, interval, trend, drivers]
      properties:
        horizon: { $ref: '#/components/schemas/ForecastHorizon' }
        validAt: { $ref: '#/components/schemas/DateTime' }
        aqi: { $ref: '#/components/schemas/NullableNumber' }
        level: { oneOf: [{ $ref: '#/components/schemas/AqiLevel' }, { type: 'null' }] }
        dominantPollutant: { oneOf: [{ $ref: '#/components/schemas/PollutantCode' }, { type: 'null' }] }
        values: { type: object, additionalProperties: { type: [number, 'null'] } }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        interval: { oneOf: [{ type: object, required: [low, high], properties: { low: { type: number }, high: { type: number } } }, { type: 'null' }] }
        trend: { type: string, enum: [up, down, stable] }
        drivers: { type: array, items: { type: string }, description: Facteurs explicatifs (SHAP) en langage clair }

    ForecastSet:
      type: object
      required: [scope, scopeId, modelName, modelVersion, generatedAt, status, forecasts]
      properties:
        scope: { type: string, enum: [city, zone, station] }
        scopeId: { type: string }
        modelName: { type: string, example: XGBoost }
        modelVersion: { type: string }
        generatedAt: { $ref: '#/components/schemas/DateTime' }
        status: { $ref: '#/components/schemas/DataStatus' }
        forecasts: { type: array, items: { $ref: '#/components/schemas/Forecast' } }

    Alert:
      type: object
      required: [id, origin, severity, status, pollutant, value, unit, threshold, reference, stationId, stationName, zoneId, zoneName, title, message, recommendations, startedAt, acknowledgedAt, resolvedAt]
      properties:
        id: { type: string }
        origin: { type: string, enum: [sensor, manual], description: 'sensor : déclenchée par une mesure ; manual : publiée par une autorité ou un administrateur' }
        severity: { $ref: '#/components/schemas/AqiLevel' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        pollutant: { $ref: '#/components/schemas/PollutantCode' }
        value: { type: number }
        unit: { $ref: '#/components/schemas/Unit' }
        threshold: { type: number }
        reference: { $ref: '#/components/schemas/ReferenceStandard' }
        stationId: { type: [string, 'null'] }
        stationName: { type: [string, 'null'] }
        zoneId: { type: [string, 'null'] }
        zoneName: { type: [string, 'null'] }
        title: { type: string }
        message: { type: string }
        recommendations: { type: array, items: { type: string } }
        startedAt: { $ref: '#/components/schemas/DateTime' }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        incidentNote: { type: [string, 'null'], description: Routes /admin uniquement }
        handledBy: { type: [string, 'null'], description: Routes /admin uniquement }
        read: { type: boolean, description: 'Routes /me uniquement : alerte déjà lue par l''utilisateur' }

    AlertCreate:
      type: object
      required: [zoneId, severity, pollutant, title, message]
      properties:
        zoneId: { type: string }
        stationId: { type: [string, 'null'] }
        severity: { $ref: '#/components/schemas/AqiLevel' }
        pollutant: { $ref: '#/components/schemas/PollutantCode' }
        value: { type: [number, 'null'], description: 'Valeur observée ; par défaut, le seuil du polluant' }
        title: { type: string, minLength: 5, maxLength: 200 }
        message: { type: string, minLength: 10, maxLength: 2000 }
        recommendations: { type: array, maxItems: 5, items: { type: string, maxLength: 200 } }

    AlertUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [acknowledged, resolved], description: Une alerte résolue ne peut pas être rouverte }
        incidentNote: { type: string, maxLength: 2000 }

    AlertPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Alert' } }
        nextCursor: { type: [string, 'null'] }
        total: { type: integer }

    Threshold:
      allOf:
        - { $ref: '#/components/schemas/ThresholdInput' }
        - type: object
          required: [id, updatedAt, updatedBy]
          properties:
            id: { type: string }
            updatedAt: { $ref: '#/components/schemas/DateTime' }
            updatedBy: { type: [string, 'null'] }

    ThresholdInput:
      type: object
      required: [pollutant, reference, period, value, unit, zoneId, alertLevel, enabled]
      properties:
        pollutant: { $ref: '#/components/schemas/PollutantCode' }
        reference: { $ref: '#/components/schemas/ReferenceStandard' }
        period: { $ref: '#/components/schemas/AveragingPeriod' }
        value: { type: number, exclusiveMinimum: 0 }
        unit: { $ref: '#/components/schemas/Unit' }
        zoneId: { type: [string, 'null'], description: null = seuil global ville }
        alertLevel: { $ref: '#/components/schemas/AqiLevel' }
        enabled: { type: boolean }

    HealthGuidance:
      type: object
      required: [profile, level, title, actions, disclaimer]
      properties:
        profile: { $ref: '#/components/schemas/HealthProfileId' }
        level: { $ref: '#/components/schemas/AqiLevel' }
        title: { type: string }
        actions: { type: array, items: { type: string } }
        disclaimer: { type: string }

    ArticleSummary:
      type: object
      required: [id, slug, title, excerpt, category, status, featured, coverImageUrl, media, tags, author, publishedAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        category: { $ref: '#/components/schemas/ArticleCategory' }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        featured: { type: boolean }
        coverImageUrl: { type: [string, 'null'], format: uri }
        media: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } }
        tags: { type: array, items: { type: string } }
        author:
          type: object
          required: [id, name, role]
          properties: { id: { type: [string, 'null'] }, name: { type: string }, role: { type: string } }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }

    Article:
      allOf:
        - { $ref: '#/components/schemas/ArticleSummary' }
        - type: object
          required: [content]
          properties: { content: { type: string, description: Markdown (HTML brut ignoré par le front) } }

    MediaAsset:
      type: object
      required: [id, kind, url, mimeType, sizeBytes, fileName, alt, width, height, durationSec, posterUrl, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video] }
        url: { type: string, format: uri, description: HTTPS }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        fileName: { type: string }
        alt: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        durationSec: { type: [number, 'null'] }
        posterUrl: { type: [string, 'null'], format: uri }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    ArticleSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ArticleSummary' } }
        nextCursor: { type: [string, 'null'] }
        total: { type: integer }

    ArticleInput:
      type: object
      required: [title, excerpt, content, category, status, featured, coverImageUrl, mediaIds, tags]
      properties:
        title: { type: string, minLength: 5, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 80 }
        excerpt: { type: string, minLength: 10, maxLength: 300 }
        content: { type: string, minLength: 20, maxLength: 50000 }
        category: { $ref: '#/components/schemas/ArticleCategory' }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        featured: { type: boolean }
        coverImageUrl: { type: [string, 'null'], format: uri, description: HTTPS uniquement }
        mediaIds: { type: array, maxItems: 10, items: { type: string }, description: "Médias envoyés via /admin/media, dans l'ordre d'affichage" }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } }

    User:
      type: object
      required: [id, email, fullName, role, status, zoneIds, healthProfile, mfaEnabled, createdAt, lastLoginAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, disabled, pending] }
        zoneIds: { type: array, items: { type: string } }
        healthProfile: { oneOf: [{ $ref: '#/components/schemas/HealthProfileId' }, { type: 'null' }] }
        mfaEnabled: { type: boolean }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        lastLoginAt: { type: [string, 'null'], format: date-time }

    Me:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          required: [permissions]
          properties: { permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } } }

    UserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        nextCursor: { type: [string, 'null'] }
        total: { type: integer }

    UserInvite:
      type: object
      required: [email, fullName, role]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }
        otp: { type: string, pattern: '^\d{6}$' }

    RegisterRequest:
      type: object
      required: [email, password, fullName, zoneIds, healthProfile, consent]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        fullName: { type: string, maxLength: 120 }
        zoneIds: { type: array, maxItems: 5, items: { type: string } }
        healthProfile: { oneOf: [{ $ref: '#/components/schemas/HealthProfileId' }, { type: 'null' }] }
        consent:
          type: object
          required: [terms, healthData]
          properties: { terms: { const: true }, healthData: { type: boolean } }

    Session:
      type: object
      required: [accessToken, accessTokenExpiresAt, user]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { $ref: '#/components/schemas/DateTime' }
        refreshToken: { type: string, description: Mobile uniquement ; le web reçoit un cookie httpOnly }
        user: { $ref: '#/components/schemas/Me' }

    MfaChallenge:
      type: object
      required: [mfaRequired, challengeId]
      properties: { mfaRequired: { const: true }, challengeId: { type: string } }

    ProfileUpdate:
      type: object
      properties:
        fullName: { type: string, maxLength: 120 }
        zoneIds: { type: array, maxItems: 5, items: { type: string } }
        healthProfile: { oneOf: [{ $ref: '#/components/schemas/HealthProfileId' }, { type: 'null' }] }

    NotificationPreferences:
      type: object
      required: [pushEnabled, emailEnabled, zoneIds, minLevel, pollutants, quietHours]
      properties:
        pushEnabled: { type: boolean }
        emailEnabled: { type: boolean }
        zoneIds: { type: array, maxItems: 5, items: { type: string } }
        minLevel: { $ref: '#/components/schemas/AqiLevel' }
        pollutants: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PollutantCode' } }
        quietHours:
          oneOf:
            - type: object
              required: [start, end]
              properties: { start: { type: string, pattern: '^\d{2}:\d{2}$' }, end: { type: string, pattern: '^\d{2}:\d{2}$' } }
            - { type: 'null' }

    DeviceRegistration:
      type: object
      required: [token, platform]
      properties: { token: { type: string }, platform: { type: string, enum: [ios, android, web] } }

    AdminDashboard:
      type: object
      required: [generatedAt, cityAqi, cityLevel, maxAqi, stations, alerts, articles, users, topZones, dataSources]
      properties:
        generatedAt: { $ref: '#/components/schemas/DateTime' }
        cityAqi: { $ref: '#/components/schemas/NullableNumber' }
        cityLevel: { oneOf: [{ $ref: '#/components/schemas/AqiLevel' }, { type: 'null' }] }
        maxAqi: { $ref: '#/components/schemas/NullableNumber' }
        stations: { type: object, properties: { total: { type: integer }, online: { type: integer }, offline: { type: integer }, maintenance: { type: integer } } }
        alerts:
          type: object
          properties:
            active: { type: integer }
            acknowledged: { type: integer }
            last24h: { type: integer }
            byLevel: { type: array, items: { type: object, properties: { level: { $ref: '#/components/schemas/AqiLevel' }, count: { type: integer } } } }
        articles: { type: object, properties: { published: { type: integer }, drafts: { type: integer } } }
        users: { type: object, properties: { total: { type: integer }, newLast7d: { type: integer } } }
        topZones: { type: array, items: { $ref: '#/components/schemas/ZoneRanking' } }
        dataSources: { type: object, properties: { healthy: { type: integer }, degraded: { type: integer }, down: { type: integer } } }

    DataSource:
      type: object
      required: [id, name, kind, status, enabled, lastSyncAt, rejectionRate24h, description]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [sensor_network, weather_api, satellite, dataset] }
        status: { type: string, enum: [healthy, degraded, down, disabled] }
        enabled: { type: boolean }
        lastSyncAt: { type: [string, 'null'], format: date-time }
        rejectionRate24h: { type: [number, 'null'], minimum: 0, maximum: 1 }
        description: { type: string }

    AiModel:
      type: object
      required: [id, name, task, algorithm, version, status, metrics, trainedAt, trackingUrl]
      properties:
        id: { type: string }
        name: { type: string }
        task: { type: string, enum: [forecast, interpolation, classification] }
        algorithm: { type: string }
        version: { type: string }
        status: { type: string, enum: [active, candidate, archived] }
        metrics: { type: object, properties: { r2: { $ref: '#/components/schemas/NullableNumber' }, rmse: { $ref: '#/components/schemas/NullableNumber' }, mae: { $ref: '#/components/schemas/NullableNumber' } } }
        trainedAt: { $ref: '#/components/schemas/DateTime' }
        trackingUrl: { type: [string, 'null'], format: uri }

    Report:
      type: object
      required: [id, period, from, to, status, format, downloadUrl, fileName, generatedAt, requestedBy]
      properties:
        id: { type: string }
        period: { type: string, enum: [weekly, monthly, custom] }
        from: { $ref: '#/components/schemas/DateTime' }
        to: { $ref: '#/components/schemas/DateTime' }
        status: { type: string, enum: [queued, running, ready, failed] }
        format: { type: string, enum: [pdf, csv, json] }
        downloadUrl: { type: [string, 'null'], format: uri }
        fileName: { type: [string, 'null'] }
        generatedAt: { type: [string, 'null'], format: date-time }
        requestedBy: { type: [string, 'null'] }

    ReportRequest:
      type: object
      required: [period, from, to, format]
      properties:
        period: { type: string, enum: [weekly, monthly, custom] }
        from: { $ref: '#/components/schemas/DateTime' }
        to: { $ref: '#/components/schemas/DateTime' }
        format: { type: string, enum: [pdf, csv, json] }

    UsageStats:
      type: object
      required: [from, to, activeUsers, sessions, pushSent, byPlatform, daily]
      properties:
        from: { $ref: '#/components/schemas/DateTime' }
        to: { $ref: '#/components/schemas/DateTime' }
        activeUsers: { type: integer }
        sessions: { type: integer }
        pushSent: { type: integer }
        byPlatform: { type: array, items: { type: object, properties: { platform: { type: string, enum: [ios, android, web] }, sessions: { type: integer } } } }
        daily: { type: array, items: { type: object, properties: { day: { type: string, format: date }, sessions: { type: integer }, activeUsers: { type: integer } } } }

    AuditLogEntry:
      type: object
      required: [id, at, actorId, actorEmail, action, resource, resourceId, changes, ip]
      properties:
        id: { type: string }
        at: { $ref: '#/components/schemas/DateTime' }
        actorId: { type: [string, 'null'], description: null si l'auteur a supprimé son compte ou pour une tâche planifiée }
        actorEmail: { type: string }
        action: { type: string, example: threshold.update }
        resource: { type: string }
        resourceId: { type: [string, 'null'] }
        changes: { type: [object, 'null'], additionalProperties: { type: object, properties: { from: {}, to: {} } } }
        ip: { type: [string, 'null'] }

    AuditLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } }
        nextCursor: { type: [string, 'null'] }
        total: { type: integer }

    ExportQuery:
      type: object
      required: [dataset, format, from, to]
      properties:
        dataset: { type: string, enum: [readings, alerts, forecasts] }
        format: { type: string, enum: [csv, json] }
        from: { $ref: '#/components/schemas/DateTime' }
        to: { $ref: '#/components/schemas/DateTime' }
        stationIds: { type: array, items: { type: string } }
