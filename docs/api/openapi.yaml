openapi: 3.1.0
info:
  title: SEN-AIR API
  version: 1.0.0
  description: |
    API REST de la plateforme SEN-AIR (qualité de l'air, Thiès).
    Contrat attendu par `senair.web` et `senair.mobile` ; miroir de `packages/core/src/api/types.ts`.
    Conventions : JSON camelCase, dates ISO-8601 UTC, valeur absente = null, pagination par curseur.
    Voir docs/08-api-endpoints.md pour les règles détaillées.
servers:
  - url: http://localhost:8000/api/v1
    description: Développement
  - url: https://api.senair.sn/api/v1
    description: Production (exemple)

tags:
  - name: Référentiel
  - name: Qualité de l'air
  - name: Prévisions
  - name: Alertes
  - name: Contenus
  - name: Authentification
  - name: Compte
  - name: Administration

security: []

paths:
  /metadata:
    get:
      tags: [Référentiel]
      summary: Version de l'API, fraîcheur des données et modèles actifs
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApiMetadata' } } } }

  /zones:
    get:
      tags: [Référentiel]
      summary: Zones géographiques de Thiès
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Zone' } } } }

  /stations:
    get:
      tags: [Qualité de l'air]
      summary: Liste des stations
      parameters:
        - { name: zoneId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/StationType' } }
        - { name: include, in: query, description: "`latest` pour inclure la dernière mesure", schema: { type: string, enum: [latest] } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Station' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /stations/{stationId}:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    get:
      tags: [Qualité de l'air]
      summary: Détail d'une station (avec dernière mesure)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Station' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /stations/{stationId}/latest:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    get:
      tags: [Qualité de l'air]
      summary: Dernière mesure consolidée d'une station
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AirQualitySnapshot' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /stations/{stationId}/history:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    get:
      tags: [Qualité de l'air]
      summary: Historique d'une station
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Granularity' }
        - { $ref: '#/components/parameters/Pollutants' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/History' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /zones/{zoneId}/history:
    parameters: [{ name: zoneId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Qualité de l'air]
      summary: Historique agrégé d'une zone
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Granularity' }
        - { $ref: '#/components/parameters/Pollutants' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/History' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /air-quality/summary:
    get:
      tags: [Qualité de l'air]
      summary: IQA synthétique de la ville ou d'une zone
      parameters:
        - { name: zoneId, in: query, schema: { type: string }, description: Absent = ville entière }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AirQualitySummary' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /air-quality/at:
    get:
      tags: [Qualité de l'air]
      summary: IQA estimé à une position (interpolation spatiale)
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LocationAirQuality' } } } }
        '404': { description: Position hors couverture, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /air-quality/heatmap:
    get:
      tags: [Qualité de l'air]
      summary: Grille interpolée pour une couche (IQA ou polluant)
      parameters:
        - { name: layer, in: query, required: true, schema: { oneOf: [{ $ref: '#/components/schemas/PollutantCode' }, { const: aqi }] } }
        - { name: at, in: query, schema: { type: string, format: date-time } }
        - { name: bbox, in: query, description: 'minLon,minLat,maxLon,maxLat', schema: { type: string, example: '-16.99,14.74,-16.88,14.83' } }
        - { name: resolutionM, in: query, schema: { type: integer, minimum: 100, maximum: 5000, default: 400 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Heatmap' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /air-quality/history:
    get:
      tags: [Qualité de l'air]
      summary: Historique agrégé de la ville (IQA ville = max des stations à chaque pas)
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Granularity' }
        - { $ref: '#/components/parameters/Pollutants' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/History' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /forecasts:
    get:
      tags: [Prévisions]
      summary: Prévisions IQA (1 h à J+3)
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [city, zone, station], default: city } }
        - { name: scopeId, in: query, schema: { type: string } }
        - { name: horizons, in: query, description: Liste séparée par des virgules, schema: { type: string, example: '1h,2h,3h,1d,2d,3d' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ForecastSet' } } } }
        '404': { description: Aucune prévision disponible (code forecast_unavailable) ou portée inconnue, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /alerts:
    get:
      tags: [Alertes]
      summary: Alertes publiées (vue publique) des ALERT_HISTORY_DAYS derniers jours (30 par défaut) ; une alerte ouverte plus ancienne reste listée tant qu'une mesure la confirme
      parameters: &alertFilters
        - { name: status, in: query, schema: { type: string }, description: 'ex. active,acknowledged' }
        - { name: severity, in: query, schema: { type: string } }
        - { name: pollutant, in: query, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/FromOptional' }
        - { $ref: '#/components/parameters/ToOptional' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AlertPage' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /alerts/{alertId}:
    parameters: [{ $ref: '#/components/parameters/AlertId' }]
    get:
      tags: [Alertes]
      summary: Détail public d'une alerte
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /thresholds:
    get:
      tags: [Référentiel]
      summary: Seuils d'alerte actifs
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Threshold' } } } }

  /health-guidance:
    get:
      tags: [Référentiel]
      summary: Recommandations sanitaires par profil et niveau
      parameters:
        - { name: profile, in: query, schema: { $ref: '#/components/schemas/HealthProfileId' } }
        - { name: level, in: query, schema: { $ref: '#/components/schemas/AqiLevel' } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HealthGuidance' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /articles:
    get:
      tags: [Contenus]
      summary: Articles publiés
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/ArticleCategory' } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleSummaryPage' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /articles/{slug}:
    parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Contenus]
      summary: Article publié
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Article' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/register:
    post:
      tags: [Authentification]
      summary: Inscription citoyen
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses:
        '201': { description: Compte créé, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Authentification]
      summary: Connexion (MFA requis pour authority/admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200':
          description: Session ouverte ou second facteur requis
          content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Session' }, { $ref: '#/components/schemas/MfaChallenge' }] } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /auth/mfa/verify:
    post:
      tags: [Authentification]
      summary: Vérification du code TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, otp]
              properties: { challengeId: { type: string }, otp: { type: string, pattern: '^\d{6}$' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /auth/refresh:
    post:
      tags: [Authentification]
      summary: Renouvellement de session (cookie httpOnly sur web, corps sur mobile)
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { refreshToken: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /auth/logout:
    post:
      tags: [Authentification]
      summary: Révocation du refresh token
      security: [{ bearer: [] }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { refreshToken: { type: string } } } } }
      responses:
        '204': { description: Déconnecté }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /auth/password/forgot:
    post:
      tags: [Authentification]
      summary: Demande de réinitialisation (réponse identique que le compte existe ou non)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '204': { description: Demande prise en compte }
        '422': { $ref: '#/components/responses/Validation' }

  /auth/password/reset:
    post:
      tags: [Authentification]
      summary: Nouveau mot de passe via jeton à usage unique
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 10 } } }
      responses:
        '204': { description: 'Mot de passe modifié et sessions révoquées' }
        '422': { $ref: '#/components/responses/Validation' }

  /me:
    get:
      tags: [Compte]
      summary: Utilisateur courant et permissions
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Compte]
      summary: Mise à jour du profil (nom, zones, profil santé)
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '422': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Compte]
      summary: Suppression du compte (droit à l'effacement)
      security: [{ bearer: [] }]
      responses:
        '204': { description: Compte supprimé }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notification-preferences:
    get:
      tags: [Compte]
      security: [{ bearer: [] }]
      summary: Préférences de notification
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Compte]
      security: [{ bearer: [] }]
      summary: Remplacement des préférences de notification
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /me/devices:
    post:
      tags: [Compte]
      security: [{ bearer: [] }]
      summary: Enregistrement d'un jeton push
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRegistration' } } } }
      responses:
        '204': { description: Enregistré }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /me/devices/{token}:
    delete:
      tags: [Compte]
      security: [{ bearer: [] }]
      summary: Désinscription d'un jeton push
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Supprimé }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/alerts:
    get:
      tags: [Compte]
      security: [{ bearer: [] }]
      summary: Alertes de l'utilisateur (zones et niveau minimum), avec l'état lu ; les alertes supprimées par l'utilisateur sont exclues
      parameters:
        - { name: status, in: query, schema: { type: string }, description: 'ex. active,acknowledged' }
        - { name: severity, in: query, schema: { type: string } }
        - { name: pollutant, in: query, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
        - { name: unread, in: query, schema: { type: boolean }, description: 'true : alertes non lues seulement' }
        - { $ref: '#/components/parameters/FromOptional' }
        - { $ref: '#/components/parameters/ToOptional' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AlertPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /me/alerts/read-all:
    post:
      tags: [Compte]
      security: [{ bearer: [] }]
      summary: Marquer toutes mes alertes comme lues
      responses:
        '204': { description: Fait }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/alerts/{alertId}/read:
    parameters: [{ $ref: '#/components/parameters/AlertId' }]
    post:
      tags: [Compte]
      security: [{ bearer: [] }]
      summary: Marquer une alerte comme lue
      responses:
        '204': { description: Fait }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/alerts/{alertId}:
    parameters: [{ $ref: '#/components/parameters/AlertId' }]
    delete:
      tags: [Compte]
      security: [{ bearer: [] }]
      summary: Retirer une alerte de mes notifications (l'alerte reste publique)
      responses:
        '204': { description: Retirée }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/dashboard:
    get:
      tags: [Administration]
      security: [{ bearer: [] }]
      summary: Indicateurs de pilotage (permission admin:access)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminDashboard' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/stations:
    get:
      tags: [Administration]
      security: [{ bearer: [] }]
      summary: Toutes les stations (admin:access)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Station' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      security: [{ bearer: [] }]
      summary: Créer une station (stations:manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StationInput' } } } }
      responses:
        '201': { description: Créée, content: { application/json: { schema: { $ref: '#/components/schemas/Station' } } } }
        '422': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stations/{stationId}:
    parameters: [{ $ref: '#/components/parameters/StationId' }]
    patch:
      tags: [Administration]
      security: [{ bearer: [] }]
      summary: Modifier une station (stations:manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StationPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Station' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /admin/thresholds:
    get:
      tags: [Administration]
      security: [{ bearer: [] }]
      summary: Tous les seuils (admin:access)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Threshold' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      security: [{ bearer: [] }]
      summary: Créer un seuil (thresholds:manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ThresholdInput' } } } }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/Threshold' } } } }
        '422': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/thresholds/{thresholdId}:
    parameters: [{ name: thresholdId, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [Administration]
      security: [{ bearer: [] }]
      summary: Modifier un seuil (thresholds:manage, audité)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ThresholdPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Threshold' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Administration]
      security: [{ bearer: [] }]
      summary: Supprimer un seuil (thresholds:manage)
      responses:
        '204': { description: Supprimé }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/alerts:
    get:
      tags: [Administration]
      security: [{ bearer: [] }]
      summary: Alertes avec informations d'incident (admin:access)
      parameters: *alertFilters
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AlertPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
    post:
      tags: [Administration]
      security: [{ bearer: [] }]
